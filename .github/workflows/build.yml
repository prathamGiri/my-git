name: Build and Test on WSL

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  BUILD_DIR: build   # inside the runner's checkout, separate from your local build

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build "$BUILD_DIR" -j"$(nproc)"

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure -j"$(nproc)"