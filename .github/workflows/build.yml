name: Build on WSL

on:
  push:
    branches: [ master ]      # change if your branch is "master"
  workflow_dispatch:

env:
  BUILD_DIR: /home/hp/projects/my-git/build

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$BUILD_DIR" -j"$(nproc)"

      - name: Show output
        run: ls -la "$BUILD_DIR"